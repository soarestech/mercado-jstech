<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercado - JSTech</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="images/icons/icon-192.png" type="image/png">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="home">

<!-- SPLASH SCREEN -->
<div id="splashScreen">
  <img src="images/logo-512.png" alt="Logo" class="splash-logo">
  <h1 class="splash-title">Mercado JSTech</h1>
  <p class="splash-version">Versão <span id="splashVersion"></span></p>
</div>

<!-- APP PRINCIPAL -->
<div id="app" class="screen" style="display: none;">
  <h4 class="center">📋 Pesquisa Mercados</h4>

  <div id="homeIcons">
    <button class="home-btn" onclick="window.location.href='pages/pesquisa.html'">
      <img src="images/search-48.png" alt="Pesquisa">
      <span>Pesquisa de Preços</span>
    </button>
    <button class="home-btn" onclick="window.location.href='pages/listas.html'">
      <img src="images/report-48.png" alt="Listas">
      <span>Listas Salvas</span>
    </button>
    <button class="home-btn" onclick="window.location.href='pages/itens.html'">
      <img src="images/shopping-48.png" alt="Itens">
      <span>Itens da Lista</span>
    </button>
    <button class="home-btn" onclick="window.location.href='pages/ferramentas.html'">
      <img src="images/settings-48.png" alt="Ferramentas">
      <span>Ferramentas</span>
    </button>
    <button class="home-btn" onclick="window.close()">
      <img src="images/exit-48.png" alt="Sair">
      <span>Sair</span>
    </button>
  </div>
</div>

<footer class="footer">
  <!-- <p>Versão: <span id="mercado-jstech-version"></span></p> -->
</footer>

<script src="js/main.js"></script>

<script>
  // Splash JS — executa apenas no index
  document.addEventListener('DOMContentLoaded', () => {
    const splash = document.getElementById('splashScreen');
    const app = document.getElementById('app');
    const versionSpan = document.getElementById('splashVersion');

    if(versionSpan) versionSpan.textContent = '1.0.0'; // ou a versão que você tiver

    // Mostrar splash por 2,5s e depois exibir app
    setTimeout(() => {
      if(splash) splash.style.display = 'none';
      if(app) app.style.display = 'flex';
    }, 2500);
  });
</script>
</body>
</html>
