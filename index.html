<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercado - JSTech</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="images/icons/icon-192.png" type="image/png">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="home">

<!-- SPLASH SCREEN -->
<div id="splashScreen">
  <img src="images/logo-512.png" alt="Logo" class="splash-logo">
  <h1 class="splash-title">Mercado JSTech</h1>
  <p class="splash-version">Versão <span id="splashVersion"></span></p>
</div>

<!-- APP PRINCIPAL -->
<div id="app" class="screen" style="display: none;">
  <h4 class="center">📋 Pesquisa Mercados</h4>

  <div id="homeIcons">
    <button class="home-btn" onclick="window.location.href='pages/pesquisa.html'">
      <img src="images/search-48.png" alt="Pesquisa">
      <span>Pesquisa Produtos</span>
    </button>

    <button class="home-btn" onclick="window.location.href='pages/listas.html'">
      <img src="images/report-48.png" alt="Listas">
      <span>Listas Salvas</span>
    </button>

    <button class="home-btn" onclick="window.location.href='pages/itens.html'">
      <img src="images/shopping-48.png" alt="Itens">
      <span>Itens da Lista</span>
    </button>

    <button class="home-btn" onclick="window.location.href='pages/ferramentas.html'">
      <img src="images/settings-48.png" alt="Ferramentas">
      <span>Ferramentas</span>
    </button>

    <button class="home-btn" onclick="window.close()">
      <img src="images/exit-48.png" alt="Sair">
      <span>Sair</span>
    </button>
  </div>
</div>

<script src="js/main.js"></script>

<script>
// Splash + versão dinâmica
document.addEventListener('DOMContentLoaded', () => {
  const splash = document.getElementById('splashScreen');
  const app = document.getElementById('app');
  const versionSpan = document.getElementById('splashVersion');

  // Pega a versão do app definida em main.js
  if (versionSpan && typeof appVersion !== 'undefined') {
    versionSpan.textContent = appVersion;
  }

  if (!splash || !app) return;

  // Inicialmente esconde app principal
  app.style.display = 'none';

  // Temporizador para sumir a splash
  setTimeout(() => {
    splash.classList.add('fade-out'); // aplica fade
    setTimeout(() => {
      splash.style.display = 'none';
      app.style.display = 'flex';
    }, 800); // duração do fade (CSS)
  }, 1500); // tempo visível da splash
});

// Service Worker CORRETO para GitHub Pages
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/mercado-jstech/service-worker.js")
    .then(() => console.log("✔ SW registrado"))
    .catch(err => console.error("Erro SW:", err));
}
</script>

</body>
</html>
