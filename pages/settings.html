<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configurações</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>

<body class="page-body">
  <header class="page-header">
    <h2>Configurações</h2>
  </header>

  <main class="page-content">
    <p>Aqui você pode ajustar as configurações do aplicativo.</p>
  </main>
  
<!-- BOTTOM TABS INTERNOS -->
<nav class="innerTabs">
  <!-- HOME -->
  <button id="goHome">
    <img src="../images/home-48.png" alt="">
    <span>Home</span>
  </button>

  <!-- SAIR -->
  <button id="goExit">
    <img src="../images/exit-48.png" alt="">
    <span>Sair</span>
  </button>
</nav>

<script>
  // → Vai para a Home que está na raiz
document.getElementById("goHome").addEventListener("click", () => {
  localStorage.setItem("skipSplash", "yes");
  window.location.href = "../index.html";
});

  // → Sair do app
document.getElementById("goExit").addEventListener("click", () => {
  if (navigator.app && navigator.app.exitApp) {
    navigator.app.exitApp(); // para Android instalado
  } else {
    window.location.href = "about:blank"; // melhor opção para navegador
  }
});
</script>
  
</body>
</html>
